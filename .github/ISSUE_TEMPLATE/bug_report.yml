name: Bug report
description: Report a problem with NOISE
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please provide as much detail as possible so the issue can be reproduced.

  - type: input
    id: version
    attributes:
      label: NOISE version
      description: Which version are you using?
      placeholder: "2.0.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: OS and version, including the architecture if relevant.
      placeholder: "Windows 11 x64 / macOS 15 Apple Silicon / Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A numbered list of steps that triggers the problem.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Screenshots / logs
      description: Drag and drop images here, or paste relevant logs.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help, such as your server software or theme.
    validations:
      required: false
